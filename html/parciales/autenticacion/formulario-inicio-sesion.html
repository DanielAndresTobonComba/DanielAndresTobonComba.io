<!-- Formulario de inicio de sesión -->
<form id="formularioInicioSesion" class="formulario-autenticacion">
  <label for="inicioSesionNombreUsuario">Usuario</label>
  <input type="text" id="inicioSesionNombreUsuario" required autocomplete="username" />

  <label for="inicioSesionContrasena">Contraseña</label>
  <input type="password" id="inicioSesionContrasena" required autocomplete="current-password" />

  <p class="error-formulario" id="errorInicioSesion"></p>

  <button type="submit" class="boton boton-primario">Entrar</button>
</form>
