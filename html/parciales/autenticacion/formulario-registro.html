<!-- Formulario para crear una cuenta nueva -->
<form id="formularioRegistro" class="formulario-autenticacion" hidden>
  <label for="registroNombreUsuario">Usuario</label>
  <input type="text" id="registroNombreUsuario" required autocomplete="username" />

  <label for="registroCorreo">Correo electrónico</label>
  <input type="email" id="registroCorreo" required autocomplete="email" />

  <label for="registroContrasena">Contraseña</label>
  <input type="password" id="registroContrasena" required autocomplete="new-password" />

  <label for="registroContrasena2">Confirmar contraseña</label>
  <input type="password" id="registroContrasena2" required autocomplete="new-password" />

  <p class="error-formulario" id="errorRegistro"></p>

  <button type="submit" class="boton boton-primario">Crear cuenta</button>
</form>
